name: Android APK

# Run by hand (Actions -> Android APK -> Run workflow) to get a signed APK.
# Pushes to ci/** branches build too, only to check that the port still compiles.
#
# The games' code is generated from the player's ROM, which never enters the
# repository. The optional secret MONOLOCO_ROMS_URL (a private link to a folder
# or .zip with your own ROMs; MONOLOCO_ROM1_URL..3 also work, one per game) puts
# those games in a hand-run APK; without it the APK has the launcher and no
# games, which can be added by importing cores built with tools/build_cores.sh.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/**'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          [ -x "$SDKM" ] || { echo "::error::No sdkmanager under $ANDROID_HOME/cmdline-tools: $(ls "$ANDROID_HOME" | tr '\n' ' ')"; exit 1; }
          (yes || true) | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --list > "$RUNNER_TEMP/sdk-list.txt" 2>&1 || true
          # Prefer the exact pinned packages; report what exists when one is missing.
          pick() {
            if grep -q "^ *$1 " "$RUNNER_TEMP/sdk-list.txt"; then echo "$1"; return; fi
            local found
            found=$(grep -o "^ *$2[^ ]*" "$RUNNER_TEMP/sdk-list.txt" | tr -d ' ' | sort -uV | tail -1)
            echo "::warning::$1 not offered; available: $(grep -o "^ *$2[^ ]*" "$RUNNER_TEMP/sdk-list.txt" | tr -d ' ' | sort -uV | tr '\n' ' ')" >&2
            echo "$found"
          }
          PLATFORM=$(pick "platforms;android-37.0" "platforms;android-37")
          NDK=$(pick "ndk;30.0.16248370" "ndk;30")
          CMAKE=$(pick "cmake;4.1.2" "cmake;4")
          echo "Installing $PLATFORM $NDK $CMAKE"
          if ! "$SDKM" --install "$PLATFORM" "$NDK" "$CMAKE" > "$RUNNER_TEMP/sdk-install.txt" 2>&1; then
            echo "::error::sdkmanager failed: $(tail -c 1500 "$RUNNER_TEMP/sdk-install.txt" | tr '\n' ' ')"
            exit 1
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Your ROMs (optional, hand-run builds only)
        if: github.event_name == 'workflow_dispatch'
        env:
          ROMS: ${{ secrets.MONOLOCO_ROMS_URL }}
          ROM1: ${{ secrets.MONOLOCO_ROM1_URL }}
          ROM2: ${{ secrets.MONOLOCO_ROM2_URL }}
          ROM3: ${{ secrets.MONOLOCO_ROM3_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/roms"
          # Dropbox share links open a web page; dl=1 downloads the file (a folder comes as a .zip).
          direct() {
            local url="$1"
            case "$url" in
              *dropbox.com*) url="${url//dl=0/dl=1}"; [[ "$url" == *dl=1* ]] || url="$url$([[ "$url" == *\?* ]] && echo '&' || echo '?')dl=1" ;;
            esac
            echo "$url"
          }
          n=0
          for name in ROMS ROM1 ROM2 ROM3; do
            url="${!name}"
            [ -n "$url" ] || continue
            n=$((n + 1))
            file="$RUNNER_TEMP/roms/download$n"
            curl -fsSL --retry 3 -o "$file" "$(direct "$url")" || { echo "::error::Cannot download the $name link"; exit 1; }
          done
          if [ "$n" -eq 0 ]; then
            echo "::notice::No MONOLOCO_ROMS_URL secret: the APK has no games."
            exit 0
          fi
          # Each ROM is recognised by its SHA-256, whatever its name; a folder link arrives as a .zip.
          for file in "$RUNNER_TEMP"/roms/download*; do
            python3 tools/find_roms.py "$file" >> local.properties
          done
          found=$(grep -c '^monoloco.rom' local.properties || true)
          [ "$found" -gt 0 ] || { echo "::error::None of the downloaded files is a supported ROM (USA v1.0)."; exit 1; }
          grep '^monoloco.rom' local.properties | sed 's/=.*//' | while read -r key; do echo "::notice::Included: $key"; done

      - name: Your private artwork (optional, hand-run builds only)
        if: github.event_name == 'workflow_dispatch'
        env:
          ART: ${{ secrets.MONOLOCO_ART_URL }}
        run: |
          # A private .zip (or folder link) whose res/ replaces the app's icons, game badges and
          # launcher backdrop in this build only; it is never committed.
          if [ -z "$ART" ]; then exit 0; fi
          url="$ART"
          case "$url" in
            *dropbox.com*) url="${url//dl=0/dl=1}"; [[ "$url" == *dl=1* ]] || url="$url$([[ "$url" == *\?* ]] && echo '&' || echo '?')dl=1" ;;
          esac
          dir="$RUNNER_TEMP/art"
          rm -rf "$dir"; mkdir -p "$dir"
          curl -sSfL --retry 3 -o "$dir/art.zip" "$url" || { echo "::warning::Could not download MONOLOCO_ART_URL: keeping the built-in artwork."; exit 0; }
          unzip -q -o "$dir/art.zip" -d "$dir/x" || { echo "::warning::MONOLOCO_ART_URL is not a .zip: keeping the built-in artwork."; exit 0; }
          # Only the known image files are taken, wherever res/ sits in the archive.
          res="$(find "$dir/x" -type d -name res | head -1)"
          if [ -z "$res" ]; then
            # A Dropbox folder link: the .zip holds the artwork .zip.
            inner="$(find "$dir/x" -name '*.zip' | head -1)"
            [ -n "$inner" ] && unzip -q -o "$inner" -d "$dir/y" && res="$(find "$dir/y" -type d -name res | head -1)"
          fi
          [ -n "$res" ] || { echo "::warning::No res/ folder in the artwork .zip."; exit 0; }
          copied=0
          for f in drawable-nodpi/launcher_backdrop.jpg drawable-nodpi/game1_logo.png drawable-nodpi/game2_logo.png \
                   drawable-nodpi/game3_logo.png drawable-nodpi/launcher_logo.png; do
            [ -f "$res/$f" ] && cp "$res/$f" "android/app/src/main/res/$f" && copied=$((copied+1))
          done
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher.png ic_launcher_background.png ic_launcher_foreground.png; do
              [ -f "$res/mipmap-$d/$f" ] && cp "$res/mipmap-$d/$f" "android/app/src/main/res/mipmap-$d/$f" && copied=$((copied+1))
            done
          done
          rm -rf "$dir"
          echo "::notice::Private artwork: $copied files replaced for this build."

      - name: Signing key
        env:
          MONOLOCO_KEYSTORE_B64: ${{ secrets.MONOLOCO_KEYSTORE_B64 }}
        run: |
          if [ -z "$MONOLOCO_KEYSTORE_B64" ]; then
            echo "::warning::No MONOLOCO_KEYSTORE_B64 secret: the APK gets a debug key and cannot update the previous install."
            exit 0
          fi
          echo "$MONOLOCO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/monolocosaga.jks"
          echo "MONOLOCO_KEYSTORE=$RUNNER_TEMP/monolocosaga.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          MONOLOCO_KEYSTORE_PASSWORD: ${{ secrets.MONOLOCO_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          # The cores of games without a ROM still compile (not linked, not packaged).
          ./gradlew --no-daemon assembleRelease -Pmonoloco.checkCores=true 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report build errors
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          # Annotations are readable without the full log.
          grep -nE "error:|FAILED|What went wrong|Exception|fatal|CMake Error" "$RUNNER_TEMP/build.log" | head -40 \
            | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          echo "::error::tail: $(tail -c 3000 "$RUNNER_TEMP/build.log" | tr '\n' ' ')"
          # CMake keeps the real compiler/configure output in its own logs.
          find android/app/.cxx -name "CMakeError.log" -o -name "CMakeConfigureLog.yaml" 2>/dev/null | head -2 \
            | while read -r f; do echo "::error::$(basename "$f"): $(tail -c 1500 "$f" | tr '\n' ' ')"; done

      - name: Remove the ROMs
        if: always()
        run: rm -rf "$RUNNER_TEMP/roms" upstream/game*/generated

      - name: Name the APK
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apk/Monoloco-Saga.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Monoloco-Saga-${{ github.run_number }}
          path: ${{ runner.temp }}/apk/Monoloco-Saga.apk
          retention-days: 7
